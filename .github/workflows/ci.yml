name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          mkdir -p .test-output/ci
          npm ci 2>&1 | tee .test-output/ci/install.log

      - name: Check formatting
        run: npm run format:check 2>&1 | tee .test-output/ci/format.log

      - name: Run tooling and game tests
        run: npm test 2>&1 | tee .test-output/ci/test.log

      - name: Build complete collection
        run: npm run build 2>&1 | tee .test-output/ci/build.log

      - name: Check Starfall campaign clears
        run: npm run check:campaign 2>&1 | tee .test-output/ci/campaign.log

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .test-output/ci/*.log
            .test-output/campaign-bot.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
